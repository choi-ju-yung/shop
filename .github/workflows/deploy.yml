name: Deploy to Oracle Cloud

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Upload files to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_KEY }}
          source: "target/demo-0.0.1-SNAPSHOT.war,docker-compose.yml"
          target: "/home/ubuntu/app/"
          strip_components: 1

      - name: Restart App
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_KEY }}
          script: |
            APP_DIR=/home/ubuntu/app
            PID_FILE=$APP_DIR/app.pid

            if [ -f $PID_FILE ] && kill -0 $(cat $PID_FILE) 2>/dev/null; then
              kill $(cat $PID_FILE)
              sleep 5
            fi
            rm -f $PID_FILE

            mkdir -p $APP_DIR /home/ubuntu/uploads

            cd $APP_DIR
            docker compose up -d

            set -a; source $APP_DIR/.env; set +a

            nohup java -Xms512m -Xmx1g \
              -Dserver.servlet.session.cookie.secure=true \
              -Dserver.servlet.session.cookie.same-site=lax \
              -jar $APP_DIR/demo-0.0.1-SNAPSHOT.war \
              >> $APP_DIR/app.log 2>&1 &

            echo $! > $PID_FILE
            echo "Started PID $(cat $PID_FILE)"
