spring.application.name=demo
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

server.servlet.session.timeout=1800

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# =============================================
# DB / OAuth / Mail 민감 정보는 application-local.properties 에 작성
# (git 에 올리지 않음 - .gitignore 에 등록됨)
# =============================================
spring.config.import=optional:classpath:application-local.properties

spring.datasource.driver-class-name=com.p6spy.engine.spy.P6SpyDriver
spring.datasource.url=${DB_URL:jdbc:p6spy:oracle:thin:@localhost:1521:xe}
spring.datasource.username=${DB_USERNAME:kakao}
spring.datasource.password=${DB_PASSWORD:kakao}

mybatis.mapper-locations=classpath:mapper/sql/**/*.xml
mybatis.configuration.map-underscore-to-camel-case=true

# PageHelper
pagehelper.helperDialect=oracle
pagehelper.reasonable=true
pagehelper.supportMethodsArguments=true

# p6spy SQL 로그 비활성화 (SqlLoggingInterceptor가 대신 처리)
logging.level.p6spy=OFF

spring.security.oauth2.client.registration.kakao.client-id=${KAKAO_CLIENT_ID:}
spring.security.oauth2.client.registration.kakao.redirect-uri=${KAKAO_REDIRECT_URI:http://localhost:8080/login/oauth2/code/kakao}
spring.security.oauth2.client.registration.kakao.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.kakao.client-authentication-method=client_secret_post
spring.security.oauth2.client.provider.kakao.authorization-uri=https://kauth.kakao.com/oauth/authorize
spring.security.oauth2.client.provider.kakao.token-uri=https://kauth.kakao.com/oauth/token
spring.security.oauth2.client.provider.kakao.user-info-uri=https://kapi.kakao.com/v2/user/me
spring.security.oauth2.client.provider.kakao.user-name-attribute=id

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2
spring.mail.properties.mail.smtp.socketFactory.class=javax.net.ssl.SSLSocketFactory
spring.mail.properties.mail.smtp.socketFactory.port=587

spring.cache.type=redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=6000

# HikariCP 커넥션 풀
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=30000

# Spring Session Redis
spring.session.store-type=redis
spring.session.redis.namespace=spring:session
spring.session.timeout=1800

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.group-id=chat-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.admin.fail-fast=false

server.servlet.session.cookie.same-site=none
server.servlet.session.cookie.secure=true

# Nginx 리버스 프록시 헤더 신뢰 (X-Forwarded-Proto, X-Forwarded-Host 등)
server.forward-headers-strategy=NATIVE

# 파일 업로드 경로 (운영환경에서는 application-local.properties 에서 재정의)
app.upload.dir=${UPLOAD_DIR:C:/upload}

# OCI Object Storage (S3 호환)
oci.storage.endpoint=${OCI_ENDPOINT:}
oci.storage.region=${OCI_REGION:ap-chuncheon-1}
oci.storage.access-key=${OCI_ACCESS_KEY:}
oci.storage.secret-key=${OCI_SECRET_KEY:}
juso.api.key=${JUSO_API_KEY:}
oci.storage.bucket=${OCI_BUCKET:shop-uploads}
oci.storage.namespace=${OCI_NAMESPACE:ax2qwygcvsrg}

# Elasticsearch
spring.elasticsearch.uris=${ES_URI:http://localhost:9200}
# 레거시 RestHighLevelClient 자동설정 제외 (Spring Boot 3.x에서 불필요)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.elasticsearch.ElasticsearchRestClientAutoConfiguration

# Actuator + Prometheus 실시간 모니터링
management.endpoints.web.exposure.include=health,info,prometheus,metrics