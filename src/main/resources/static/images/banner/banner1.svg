<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f2027"/>
      <stop offset="50%" style="stop-color:#1a6b5c"/>
      <stop offset="100%" style="stop-color:#20c997"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="420" fill="url(#bg1)" rx="30"/>

  <!-- 배경 원형 장식 -->
  <circle cx="1100" cy="80"  r="200" fill="white" fill-opacity="0.04"/>
  <circle cx="1180" cy="350" r="130" fill="white" fill-opacity="0.05"/>
  <circle cx="180"  cy="380" r="160" fill="white" fill-opacity="0.03"/>

  <!-- 왼쪽 아이콘 영역 -->
  <circle cx="220" cy="210" r="110" fill="white" fill-opacity="0.08"/>
  <text x="220" y="240" font-size="90" text-anchor="middle">🎉</text>

  <!-- 메인 타이틀 -->
  <text x="430" y="160"
        font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif"
        font-size="22" font-weight="500" fill="white" fill-opacity="0.7"
        letter-spacing="6">NEW OPEN</text>

  <text x="430" y="250"
        font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif"
        font-size="72" font-weight="900" fill="white"
        letter-spacing="-2">니꺼내꺼</text>

  <text x="432" y="310"
        font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif"
        font-size="26" font-weight="400" fill="white" fill-opacity="0.85"
        letter-spacing="1">새로운 중고거래 플랫폼이 지금 문을 열었습니다</text>

  <!-- 뱃지 버튼 -->
  <rect x="432" y="340" width="180" height="44" rx="22" fill="#20c997"/>
  <text x="522" y="368"
        font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif"
        font-size="16" font-weight="700" fill="white" text-anchor="middle"
        letter-spacing="1">지금 둘러보기 →</text>

  <!-- 우측 장식 점들 -->
  <circle cx="1050" cy="160" r="8"  fill="white" fill-opacity="0.2"/>
  <circle cx="1080" cy="200" r="5"  fill="white" fill-opacity="0.15"/>
  <circle cx="1020" cy="220" r="4"  fill="white" fill-opacity="0.1"/>
  <circle cx="1060" cy="270" r="10" fill="white" fill-opacity="0.1"/>
</svg>
