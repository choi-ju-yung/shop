<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#20c997"/>
      <stop offset="100%" style="stop-color:#38ef7d"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="420" fill="url(#bg3)" rx="30"/>

  <!-- 배경 장식 -->
  <circle cx="200"  cy="100" r="150" fill="#20c997" fill-opacity="0.05"/>
  <circle cx="1100" cy="320" r="200" fill="#20c997" fill-opacity="0.06"/>

  <!-- 왼쪽 텍스트 영역 -->
  <text x="120" y="155"
        font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif"
        font-size="18" font-weight="500" fill="#20c997"
        letter-spacing="4">SELL &amp; BUY EASILY</text>

  <text x="120" y="240"
        font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif"
        font-size="58" font-weight="900" fill="white"
        letter-spacing="-2">내 물건을 팔고</text>

  <text x="120" y="310"
        font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif"
        font-size="58" font-weight="900" fill="url(#accent)"
        letter-spacing="-2">원하는 걸 사세요</text>

  <text x="120" y="365"
        font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif"
        font-size="18" fill="white" fill-opacity="0.55"
        letter-spacing="1">니꺼내꺼에서 쉽고 빠르게 거래를 시작해보세요</text>

  <!-- 오른쪽 통계 카드 -->
  <rect x="820" y="80" width="380" height="260" rx="24"
        fill="white" fill-opacity="0.06"
        stroke="white" stroke-opacity="0.1" stroke-width="1"/>

  <text x="1010" y="160"
        font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif"
        font-size="15" fill="white" fill-opacity="0.5"
        text-anchor="middle" letter-spacing="3">지금 이 순간</text>

  <rect x="860" y="180" width="120" height="90" rx="16" fill="white" fill-opacity="0.07"/>
  <text x="920" y="228"
        font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif"
        font-size="28" font-weight="900" fill="#20c997"
        text-anchor="middle">1,240+</text>
  <text x="920" y="254"
        font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif"
        font-size="12" fill="white" fill-opacity="0.5"
        text-anchor="middle">등록된 상품</text>

  <rect x="1000" y="180" width="120" height="90" rx="16" fill="white" fill-opacity="0.07"/>
  <text x="1060" y="228"
        font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif"
        font-size="28" font-weight="900" fill="#38ef7d"
        text-anchor="middle">320+</text>
  <text x="1060" y="254"
        font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif"
        font-size="12" fill="white" fill-opacity="0.5"
        text-anchor="middle">활성 회원</text>

  <text x="1010" y="316"
        font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif"
        font-size="14" fill="white" fill-opacity="0.4"
        text-anchor="middle">오늘도 거래가 이루어지고 있어요 🔄</text>
</svg>
